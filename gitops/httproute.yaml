apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ops-metrics-route
  namespace: agent-office
  labels: {app.kubernetes.io/name: ops-metrics, app.kubernetes.io/component: backend-route}
spec:
  parentRefs:
    - {group: gateway.networking.k8s.io, kind: Gateway, name: mcp-gateway, namespace: agent-office, sectionName: mcps}
  hostnames: [ops-metrics.mcp.local]
  rules:
    - matches:
        - path: {type: PathPrefix, value: /mcp}
      backendRefs:
        - {name: ops-metrics, port: 8080}
