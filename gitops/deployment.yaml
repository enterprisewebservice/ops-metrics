apiVersion: apps/v1
kind: Deployment
metadata:
  name: ops-metrics
  namespace: agent-office
  labels: {app.kubernetes.io/name: ops-metrics, app.kubernetes.io/part-of: supply-chain-services}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: ops-metrics}
  template:
    metadata:
      labels: {app.kubernetes.io/name: ops-metrics}
    spec:
      imagePullSecrets: [{name: quay-pull-secret}]
      containers:
        - name: ops-metrics
          image: quay-quay-quay-test.apps.salamander.aimlworkbench.com/deanpeterson/ops-metrics:main
          imagePullPolicy: Always
          ports: [{containerPort: 8080, name: http}]
          env:
            - {name: PORT, value: "8080"}
            - {name: ORDERS_API_URL, value: "http://orders-api.agent-office.svc.cluster.local:8080"}
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
